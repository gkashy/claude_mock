[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekglmm"
version = "0.1.0"
description = "Efficient Knowledge Graph and Long-term Memory Manager -- built on graphify"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "graphify @ git+https://github.com/safishamsi/graphify.git@v3",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
postgres = ["sqlalchemy[asyncio]>=2.0.0", "asyncpg>=0.30.0"]
qdrant = ["qdrant-client>=1.12.0"]
pgvector = ["asyncpg>=0.30.0"]
openai = ["openai>=1.60.0"]
anthropic = ["anthropic>=0.42.0"]
all = ["ekglmm[postgres,qdrant,openai,anthropic]"]
supabase = ["ekglmm[postgres,pgvector,openai,anthropic]"]

[tool.setuptools.packages.find]
include = ["ekglmm*"]
