<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --surface3: #2a2a2a;
    --border: #2e2e2e;
    --border-light: #3a3a3a;
    --text: #e4e4e4;
    --text-muted: #888;
    --text-dim: #666;
    --accent: #7c6ff7;
    --accent-dim: #5a4fd4;
    --user-bg: #2a2745;
    --tool-bg: #1e2a1e;
    --tool-border: #3a5a3a;
    --error: #e74c3c;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "Fira Code", "Consolas", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s ease, min-width 0.25s ease;
    overflow: hidden;
  }

  .sidebar.collapsed {
    width: 0;
    min-width: 0;
    border-right: none;
  }

  .sidebar.collapsed > *:not(.sidebar-collapse-btn) { display: none; }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-header h2 { font-size: 15px; font-weight: 600; }

  .btn-collapse {
    position: fixed;
    top: 12px;
    left: 268px;
    z-index: 100;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 24px;
    height: 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left 0.25s ease;
  }

  .btn-collapse:hover { background: var(--surface3); color: var(--text); }
  .btn-collapse.shifted { left: 8px; }

  .btn-new {
    background: var(--accent);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }

  .btn-new:hover { background: var(--accent-dim); }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .session-item {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .session-item:hover { background: var(--surface2); color: var(--text); }
  .session-item.active { background: var(--surface2); color: var(--text); font-weight: 500; }

  .sidebar-tabs {
    display: flex;
    border-top: 1px solid var(--border);
  }

  .sidebar-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border: none;
    background: none;
  }

  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active { color: var(--accent); border-top: 2px solid var(--accent); }

  .memory-list {
    flex: 1;
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }

  .memory-list #memoryList {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .memory-toolbar {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .memory-search {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    outline: none;
  }

  .memory-search:focus { border-color: var(--accent); }

  .memory-search::placeholder { color: var(--text-dim); }

  .memory-toolbar-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .memory-count {
    font-size: 11px;
    color: var(--text-dim);
  }

  .btn-extract {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--font);
  }

  .btn-extract:hover { background: var(--surface3); color: var(--text); }
  .btn-extract:disabled { opacity: 0.4; cursor: not-allowed; }

  .memory-item {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .memory-item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
  }

  .memory-item .fact-text {
    flex: 1;
    line-height: 1.4;
    cursor: pointer;
  }

  .memory-item .fact-text:hover { color: var(--text); }

  .fact-meta {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    gap: 10px;
  }

  .fact-score {
    color: var(--accent);
    font-weight: 500;
  }

  .fact-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }

  .btn-fact-action {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    padding: 0 4px;
  }

  .btn-fact-action:hover { color: var(--text); }
  .btn-fact-action.delete:hover { color: var(--error); }

  .fact-edit-area {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 6px 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    resize: vertical;
    min-height: 40px;
    outline: none;
    line-height: 1.4;
  }

  .fact-edit-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .btn-fact-save, .btn-fact-cancel {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }

  .btn-fact-save { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-fact-save:hover { background: var(--accent-dim); }
  .btn-fact-cancel:hover { color: var(--text); }

  .memory-tab-badge {
    background: var(--accent);
    color: white;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 8px;
    margin-left: 4px;
  }

  /* ---- Main content area ---- */
  .main-wrapper {
    flex: 1;
    display: flex;
    min-width: 0;
  }

  /* ---- Chat panel ---- */
  .chat-panel {
    display: flex;
    flex-direction: column;
    min-width: 280px;
    flex: 1 1 50%;
  }

  /* ---- Drag divider ---- */
  .panel-divider {
    width: 0;
    flex-shrink: 0;
    position: relative;
    cursor: col-resize;
    z-index: 10;
    display: none;
  }

  .panel-divider.visible { display: block; width: 5px; }

  .panel-divider::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 2px;
    width: 1px;
    background: var(--border);
    transition: background 0.15s;
  }

  .panel-divider:hover::before,
  .panel-divider.dragging::before {
    background: var(--accent);
    width: 3px;
    left: 1px;
  }

  .panel-divider::after {
    content: "";
    position: absolute;
    top: 50%;
    left: -3px;
    transform: translateY(-50%);
    width: 11px;
    height: 32px;
    border-radius: 4px;
    background: var(--surface3);
    border: 1px solid var(--border);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .panel-divider:hover::after,
  .panel-divider.dragging::after { opacity: 1; }

  .chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    line-height: 1.6;
    font-size: 14px;
  }

  .msg-user {
    background: var(--user-bg);
    padding: 12px 16px;
    border-radius: 12px;
  }

  .msg-assistant { padding: 4px 0; }
  .msg-assistant p { margin-bottom: 8px; }
  .msg-assistant p:last-child { margin-bottom: 0; }

  .msg-assistant code {
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
  }

  .msg-assistant pre {
    background: var(--surface);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    border: 1px solid var(--border);
  }

  .msg-assistant pre code { background: none; padding: 0; font-size: 13px; }
  .msg-assistant strong { font-weight: 600; }
  .msg-assistant ul, .msg-assistant ol { padding-left: 20px; margin: 8px 0; }
  .msg-assistant li { margin-bottom: 3px; }
  .msg-assistant h1, .msg-assistant h2, .msg-assistant h3 { margin: 12px 0 6px 0; font-weight: 600; }
  .msg-assistant h1 { font-size: 18px; }
  .msg-assistant h2 { font-size: 16px; }
  .msg-assistant h3 { font-size: 14px; }
  .msg-assistant a { color: var(--accent); text-decoration: none; }
  .msg-assistant a:hover { text-decoration: underline; }
  .msg-assistant hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .msg-assistant blockquote {
    border-left: 3px solid var(--accent);
    margin: 8px 0;
    padding: 4px 12px;
    color: var(--text-muted);
    background: var(--surface2);
    border-radius: 0 6px 6px 0;
  }
  .msg-assistant table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0;
    font-size: 13px;
  }
  .msg-assistant th {
    background: var(--surface2);
    padding: 8px 12px;
    text-align: left;
    font-weight: 600;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .msg-assistant td {
    padding: 7px 12px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    vertical-align: top;
  }
  .msg-assistant tr:nth-child(even) td { background: var(--surface2); }

  .tool-block {
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 8px auto;
    font-size: 12px;
    max-width: 780px;
    width: 100%;
  }

  .tool-block summary {
    cursor: pointer;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 12px;
  }

  .tool-block pre {
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-muted);
    font-size: 12px;
    max-height: 200px;
    overflow-y: auto;
  }

  .thinking-block {
    max-width: 780px;
    width: 100%;
    margin: 4px auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
  }

  .thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    color: var(--text-muted);
    user-select: none;
  }

  .thinking-header:hover { background: var(--surface2); }

  .thinking-spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  .thinking-block.done .thinking-spinner {
    display: none;
  }

  .thinking-check {
    display: none;
    color: var(--accent);
    font-size: 14px;
    flex-shrink: 0;
  }

  .thinking-block.done .thinking-check { display: inline; }

  .thinking-summary {
    flex: 1;
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .thinking-toggle {
    color: var(--text-dim);
    font-size: 11px;
    flex-shrink: 0;
  }

  .thinking-body {
    display: none;
    padding: 0 12px 10px;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
  }

  .thinking-block.expanded .thinking-body { display: block; }
  .thinking-block.expanded .thinking-toggle::after { content: "Hide"; }
  .thinking-block:not(.expanded) .thinking-toggle::after { content: "Show"; }

  .thinking-done-badge {
    display: none;
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 12px 8px;
  }

  .thinking-block.done .thinking-done-badge { display: block; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .input-area {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .input-row {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-row textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 200px;
    line-height: 1.5;
  }

  .input-row textarea:focus { border-color: var(--accent); }

  .btn-send {
    background: var(--accent);
    color: white;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .btn-send:hover { background: var(--accent-dim); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- Artifact panel ---- */
  .artifact-panel {
    width: 0;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .artifact-panel.open {
    flex: 1 1 50%;
    min-width: 300px;
    width: auto;
  }

  .artifact-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }

  .artifact-title {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .artifact-meta {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .artifact-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .artifact-actions button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
  }

  .artifact-actions button:hover { background: var(--surface3); color: var(--text); }

  .artifact-content {
    flex: 1;
    overflow: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .artifact-content pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }

  .artifact-content .rendered-md {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  .artifact-content .rendered-md h1 { font-size: 22px; margin: 16px 0 8px; }
  .artifact-content .rendered-md h2 { font-size: 18px; margin: 14px 0 6px; }
  .artifact-content .rendered-md h3 { font-size: 15px; margin: 12px 0 4px; }
  .artifact-content .rendered-md p { margin-bottom: 10px; }
  .artifact-content .rendered-md ul, .artifact-content .rendered-md ol { padding-left: 20px; margin: 8px 0; }
  .artifact-content .rendered-md code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
  .artifact-content .rendered-md pre { background: var(--bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin: 8px 0; }
  .artifact-content .rendered-md pre code { background: none; padding: 0; }

  .artifact-content .rendered-html {
    background: white;
    border-radius: 8px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .artifact-content .rendered-html iframe {
    width: 100%;
    flex: 1;
    min-height: 0;
    border: none;
    border-radius: 8px;
  }

  .artifact-streaming pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }

  @keyframes cursor-blink {
    50% { opacity: 0; }
  }

  /* Skeleton loader */
  .artifact-skeleton {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 2px 0 16px;
  }

  .skeleton-line {
    height: 12px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
    background-size: 300% 100%;
    animation: skeleton-shimmer 1.6s ease-in-out infinite;
  }

  @keyframes skeleton-shimmer {
    0%   { background-position: 300% 0; }
    100% { background-position: -300% 0; }
  }

  /* Writing status bar */
  .artifact-write-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0 12px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .write-status-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
    animation: dot-pulse 1.2s ease-in-out infinite;
  }

  @keyframes dot-pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  /* Inline blinking cursor at end of streamed content */
  .stream-cursor {
    display: inline-block;
    width: 2px;
    height: 0.85em;
    background: var(--accent);
    margin-left: 1px;
    vertical-align: text-bottom;
    border-radius: 1px;
    animation: cursor-blink 0.75s step-end infinite;
  }

  .artifact-stream-content {
    position: relative;
  }

  /* Artifact tab bar */
  .artifact-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
    background: var(--surface);
    scrollbar-width: none;
  }

  .artifact-tabs::-webkit-scrollbar { display: none; }

  .artifact-tab {
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: var(--font);
    transition: color 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .artifact-tab:hover { color: var(--text); background: var(--surface2); }
  .artifact-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Version navigation */
  .version-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .version-nav button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 26px;
    height: 26px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    padding: 0;
  }

  .version-nav button:hover { background: var(--surface3); color: var(--text); }
  .version-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

  .version-nav .version-label {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    min-width: 40px;
    text-align: center;
  }

  /* Artifact reference in chat */
  .artifact-ref {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 8px auto;
    max-width: 780px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s;
  }

  .artifact-ref:hover { border-color: var(--accent); }

  .artifact-ref-icon {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .artifact-ref-info { flex: 1; }
  .artifact-ref-title { font-size: 13px; font-weight: 600; }
  .artifact-ref-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<button class="btn-collapse" id="btnCollapse" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Agent Chat</h2>
    <button class="btn-new" onclick="newSession()">+ New</button>
  </div>
  <div class="session-list" id="sessionList"></div>
  <div class="memory-list" id="memoryPanel" style="display:none;">
    <div class="memory-toolbar">
      <input type="text" class="memory-search" id="memorySearch"
        placeholder="Search memories semantically..." oninput="debounceMemorySearch()">
      <div class="memory-toolbar-row">
        <span class="memory-count" id="memoryCount"></span>
        <button class="btn-extract" id="btnExtract" onclick="extractFacts()"
          title="Extract facts from current session">Extract</button>
      </div>
    </div>
    <div id="memoryList"></div>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" id="tabSessions" onclick="showTab('sessions')">Sessions</button>
    <button class="sidebar-tab" id="tabMemory" onclick="showTab('memory')">Memory<span class="memory-tab-badge" id="memoryBadge" style="display:none;"></span></button>
  </div>
</aside>

<div class="main-wrapper">
  <main class="chat-panel" id="chatPanel">
    <div class="chat-header" id="chatHeader">Start a new conversation</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" placeholder="Type a message..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="btnSend" onclick="send()">&#8593;</button>
      </div>
    </div>
  </main>

  <div class="panel-divider" id="panelDivider"></div>
  <aside class="artifact-panel" id="artifactPanel">
    <div class="artifact-header">
      <span class="artifact-title" id="artifactTitle"></span>
      <div class="version-nav" id="versionNav" style="display:none;">
        <button onclick="navigateVersion(-1)" id="btnPrevVer" title="Previous version">&#8249;</button>
        <span class="version-label" id="versionLabel"></span>
        <button onclick="navigateVersion(1)" id="btnNextVer" title="Next version">&#8250;</button>
      </div>
      <span class="artifact-meta" id="artifactMeta"></span>
      <div class="artifact-actions">
        <button onclick="copyArtifact()">Copy</button>
        <button onclick="downloadArtifact()">Download</button>
        <button onclick="closeArtifact()">Close</button>
      </div>
    </div>
    <div class="artifact-tabs" id="artifactTabs"></div>
    <div class="artifact-content" id="artifactContent"></div>
  </aside>
</div>

<script>
const API = window.location.origin;
let ws = null;
let currentSessionId = null;
let currentAssistantEl = null;
let assistantBuffer = "";
let sending = false;
let currentArtifact = null;
let sessionArtifacts = [];
let activeArtifactIdx = -1;
let viewingVersion = null;
let currentThinkingEl = null;
let thinkingBuffer = "";
let artifactStreamingEl = null;
let artifactStreamBuffer = "";
let artifactStreamMeta = null;

// ---- Sessions ----

async function loadSessions() {
  const res = await fetch(`${API}/api/sessions`);
  const sessions = await res.json();
  const list = document.getElementById("sessionList");
  list.innerHTML = "";
  sessions.forEach(s => {
    const div = document.createElement("div");
    div.className = "session-item" + (s.id === currentSessionId ? " active" : "");
    div.textContent = s.title || "(untitled)";
    div.onclick = () => openSession(s.id, s.title);
    list.appendChild(div);
  });
}

async function newSession() {
  const res = await fetch(`${API}/api/sessions`, { method: "POST" });
  const data = await res.json();
  currentSessionId = data.session_id;
  localStorage.setItem("lastSessionId", currentSessionId);
  document.getElementById("messages").innerHTML = "";
  document.getElementById("chatHeader").textContent = "New conversation";
  sessionArtifacts = [];
  activeArtifactIdx = -1;
  closeArtifact();
  connectWs();
  loadSessions();
}

async function openSession(id, title) {
  currentSessionId = id;
  localStorage.setItem("lastSessionId", id);
  document.getElementById("chatHeader").textContent = title || "Chat";
  closeArtifact();

  const [msgRes, artRes] = await Promise.all([
    fetch(`${API}/api/sessions/${id}/messages`),
    fetch(`${API}/api/sessions/${id}/artifacts`),
  ]);
  const msgs = await msgRes.json();
  const arts = await artRes.json();

  sessionArtifacts = arts.map(a => ({
    id: a.id,
    title: a.title,
    content_type: a.content_type,
    language: a.language || "",
    filename: a.filename,
    current_version: a.current_version,
  }));

  const container = document.getElementById("messages");
  container.innerHTML = "";
  msgs.forEach(m => {
    if (m.role === "user") {
      const text = typeof m.content === "string" ? m.content : "";
      if (text && !text.startsWith("[System note:")) addUserMsg(text);
    } else if (m.role === "assistant") {
      const text = typeof m.content === "string" ? m.content :
        (Array.isArray(m.content)
          ? m.content.filter(b => b.type === "text").map(b => b.text).join("")
          : "");
      if (text.trim()) addAssistantMsg(text);
    }
  });

  sessionArtifacts.forEach(a => addArtifactRef(a));
  renderArtifactTabs();
  scrollBottom();
  connectWs();
  loadSessions();
}

// ---- Memory ----

let memorySearchTimer = null;

async function loadMemory() {
  const res = await fetch(`${API}/api/facts`);
  const facts = await res.json();
  renderFactList(facts, false);
  updateMemoryBadge(facts.length);
}

async function searchMemory(query) {
  if (!query.trim()) { loadMemory(); return; }
  const res = await fetch(`${API}/api/facts/search?q=${encodeURIComponent(query)}`);
  const results = await res.json();
  renderFactList(results, true);
}

function debounceMemorySearch() {
  clearTimeout(memorySearchTimer);
  const q = document.getElementById("memorySearch").value;
  memorySearchTimer = setTimeout(() => searchMemory(q), 400);
}

function renderFactList(facts, showScore) {
  const list = document.getElementById("memoryList");
  const countEl = document.getElementById("memoryCount");
  list.innerHTML = "";

  if (facts.length === 0) {
    list.innerHTML = '<div class="memory-item"><span class="fact-text" style="color:var(--text-dim)">No memories found.</span></div>';
    countEl.textContent = "0 facts";
    return;
  }

  countEl.textContent = `${facts.length} fact${facts.length === 1 ? "" : "s"}`;

  facts.forEach(f => {
    const div = document.createElement("div");
    div.className = "memory-item";
    div.id = `fact-${f.id}`;

    let metaHtml = "";
    if (showScore && f.score > 0) {
      metaHtml += `<span class="fact-score">${Math.round(f.score * 100)}% match</span>`;
    }
    if (f.updated_at) {
      metaHtml += `<span>updated ${timeAgo(f.updated_at)}</span>`;
    } else if (f.created_at) {
      metaHtml += `<span>saved ${timeAgo(f.created_at)}</span>`;
    }

    div.innerHTML = `
      <div class="memory-item-top">
        <span class="fact-text" onclick="startEditFact('${f.id}', this)" title="Click to edit">${esc(f.content)}</span>
        <div class="fact-actions">
          <button class="btn-fact-action" onclick="startEditFact('${f.id}')" title="Edit">&#9998;</button>
          <button class="btn-fact-action delete" onclick="deleteFact('${f.id}')" title="Delete">&times;</button>
        </div>
      </div>
      ${metaHtml ? `<div class="fact-meta">${metaHtml}</div>` : ""}`;
    list.appendChild(div);
  });
}

function startEditFact(id, clickedEl) {
  const item = document.getElementById(`fact-${id}`);
  if (!item) return;
  const textEl = item.querySelector(".fact-text");
  const currentText = textEl.textContent;

  item.innerHTML = `
    <textarea class="fact-edit-area" id="edit-${id}">${esc(currentText)}</textarea>
    <div class="fact-edit-actions">
      <button class="btn-fact-cancel" onclick="cancelEditFact()">Cancel</button>
      <button class="btn-fact-save" onclick="saveEditFact('${id}')">Save</button>
    </div>`;

  const textarea = document.getElementById(`edit-${id}`);
  textarea.focus();
  textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  textarea.style.height = textarea.scrollHeight + "px";
}

function cancelEditFact() {
  const q = document.getElementById("memorySearch").value;
  if (q.trim()) { searchMemory(q); } else { loadMemory(); }
}

async function saveEditFact(id) {
  const textarea = document.getElementById(`edit-${id}`);
  const content = textarea.value.trim();
  if (!content) return;

  const res = await fetch(`${API}/api/facts/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content }),
  });
  const data = await res.json();
  if (data.updated) {
    const q = document.getElementById("memorySearch").value;
    if (q.trim()) { searchMemory(q); } else { loadMemory(); }
  }
}

async function deleteFact(id) {
  if (!confirm("Delete this memory permanently?")) return;
  await fetch(`${API}/api/facts/${id}`, { method: "DELETE" });
  const q = document.getElementById("memorySearch").value;
  if (q.trim()) { searchMemory(q); } else { loadMemory(); }
}

async function extractFacts() {
  if (!currentSessionId) return;
  const btn = document.getElementById("btnExtract");
  btn.disabled = true;
  btn.textContent = "Extracting...";
  try {
    const res = await fetch(`${API}/api/sessions/${currentSessionId}/extract`, { method: "POST" });
    const data = await res.json();
    const count = (data.extracted || []).length;
    btn.textContent = count > 0 ? `Extracted ${count}` : "Nothing new";
    if (count > 0) loadMemory();
  } catch (e) {
    btn.textContent = "Error";
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = "Extract"; }, 2000);
}

function updateMemoryBadge(count) {
  const badge = document.getElementById("memoryBadge");
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = "inline";
  } else {
    badge.style.display = "none";
  }
}

function timeAgo(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  return new Date(isoStr).toLocaleDateString();
}

function showTab(tab) {
  const sl = document.getElementById("sessionList");
  const mp = document.getElementById("memoryPanel");
  const ts = document.getElementById("tabSessions");
  const tm = document.getElementById("tabMemory");
  if (tab === "sessions") {
    sl.style.display = "block"; mp.style.display = "none";
    ts.classList.add("active"); tm.classList.remove("active");
    loadSessions();
  } else {
    sl.style.display = "none"; mp.style.display = "flex"; mp.style.flexDirection = "column"; mp.style.flex = "1";
    ts.classList.remove("active"); tm.classList.add("active");
    loadMemory();
  }
}

// ---- Artifacts ----

function renderArtifactTabs() {
  const tabsEl = document.getElementById("artifactTabs");
  tabsEl.innerHTML = "";
  if (sessionArtifacts.length <= 1) return;

  sessionArtifacts.forEach((a, i) => {
    const btn = document.createElement("button");
    btn.className = "artifact-tab" + (i === activeArtifactIdx ? " active" : "");
    btn.textContent = a.title;
    btn.title = a.filename;
    btn.onclick = () => openArtifactTab(i);
    tabsEl.appendChild(btn);
  });
}

async function openArtifactTab(index) {
  if (index < 0 || index >= sessionArtifacts.length) return;
  activeArtifactIdx = index;
  viewingVersion = null;
  const meta = sessionArtifacts[index];
  const res = await fetch(`${API}/api/artifacts/${meta.id}`);
  const artifact = await res.json();
  if (artifact.error) return;

  meta.current_version = artifact.total_versions;
  showArtifactContent(artifact);
  renderArtifactTabs();
}

function showArtifactContent(artifact) {
  currentArtifact = artifact;
  viewingVersion = artifact.version;

  const panel = document.getElementById("artifactPanel");
  const chatPanel = document.getElementById("chatPanel");

  document.getElementById("artifactTitle").textContent = artifact.title;
  document.getElementById("artifactMeta").textContent = artifact.filename;

  const totalVer = artifact.total_versions || artifact.version || 1;
  const versionNav = document.getElementById("versionNav");
  if (totalVer > 1) {
    versionNav.style.display = "flex";
    document.getElementById("versionLabel").textContent = `v${artifact.version}/${totalVer}`;
    document.getElementById("btnPrevVer").disabled = artifact.version <= 1;
    document.getElementById("btnNextVer").disabled = artifact.version >= totalVer;
  } else {
    versionNav.style.display = "none";
  }

  const contentEl = document.getElementById("artifactContent");

  if (artifact.content_type === "html") {
    const iframe = document.createElement("iframe");
    iframe.srcdoc = artifact.content;
    iframe.sandbox = "allow-scripts";
    contentEl.innerHTML = '<div class="rendered-html"></div>';
    contentEl.querySelector(".rendered-html").appendChild(iframe);
  } else if (artifact.content_type === "markdown" || artifact.content_type === "document") {
    contentEl.innerHTML = `<div class="rendered-md">${renderMarkdown(artifact.content)}</div>`;
  } else {
    contentEl.innerHTML = `<pre>${esc(artifact.content)}</pre>`;
  }

  panel.classList.add("open");
  document.getElementById("panelDivider").classList.add("visible");
}

function showArtifact(artifact) {
  const idx = sessionArtifacts.findIndex(a => a.id === artifact.id);
  if (idx >= 0) {
    activeArtifactIdx = idx;
    sessionArtifacts[idx].current_version = artifact.version || sessionArtifacts[idx].current_version;
    sessionArtifacts[idx].title = artifact.title;
  }
  showArtifactContent(artifact);
  renderArtifactTabs();
}

async function navigateVersion(delta) {
  if (!currentArtifact || !currentArtifact.id) return;
  const targetVer = (viewingVersion || 1) + delta;
  if (targetVer < 1) return;

  const res = await fetch(`${API}/api/artifacts/${currentArtifact.id}?version=${targetVer}`);
  const artifact = await res.json();
  if (artifact.error) return;

  showArtifactContent(artifact);
}

function closeArtifact() {
  const panel = document.getElementById("artifactPanel");
  const chatPanel = document.getElementById("chatPanel");
  const divider = document.getElementById("panelDivider");

  panel.classList.remove("open");
  divider.classList.remove("visible");
  panel.style.flex = "";
  chatPanel.style.flex = "";

  currentArtifact = null;
  activeArtifactIdx = -1;
  viewingVersion = null;
}

function copyArtifact() {
  if (!currentArtifact) return;
  navigator.clipboard.writeText(currentArtifact.content).then(() => {
    const btn = event.target;
    btn.textContent = "Copied";
    setTimeout(() => btn.textContent = "Copy", 1500);
  });
}

function downloadArtifact() {
  if (!currentArtifact) return;
  const blob = new Blob([currentArtifact.content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = currentArtifact.filename;
  a.click();
  URL.revokeObjectURL(url);
}

function addArtifactRef(artifact) {
  const container = document.getElementById("messages");
  const icons = { code: "</\>", document: "D", html: "</>", markdown: "M", csv: "T", json: "{}", text: "T" };
  const icon = icons[artifact.content_type] || "F";

  const div = document.createElement("div");
  div.className = "artifact-ref";
  div.onclick = () => {
    if (artifact.id) {
      const idx = sessionArtifacts.findIndex(a => a.id === artifact.id);
      if (idx >= 0) openArtifactTab(idx);
      else showArtifact(artifact);
    } else {
      showArtifact(artifact);
    }
  };
  div.innerHTML = `
    <div class="artifact-ref-icon">${icon}</div>
    <div class="artifact-ref-info">
      <div class="artifact-ref-title">${esc(artifact.title)}</div>
      <div class="artifact-ref-meta">${esc(artifact.filename)}${artifact.version > 1 ? ' (v' + artifact.version + ')' : ''}</div>
    </div>`;
  container.appendChild(div);
  scrollBottom();
}

// ---- Artifact Streaming ----

const SKELETON_WIDTHS = [62, 88, 71, 95, 55, 79, 42, 83, 68, 91, 50, 76];

function skeletonHTML() {
  return '<div class="artifact-skeleton">' +
    SKELETON_WIDTHS.map(w => `<div class="skeleton-line" style="width:${w}%"></div>`).join("") +
    '</div>';
}

function startArtifactStream(meta) {
  artifactStreamBuffer = "";
  artifactStreamMeta = meta || {};

  const titleEl = document.getElementById("artifactTitle");
  const metaEl  = document.getElementById("artifactMeta");
  const contentEl = document.getElementById("artifactContent");

  titleEl.textContent = artifactStreamMeta.title || "Generating...";
  metaEl.textContent  = artifactStreamMeta.filename || "";

  contentEl.innerHTML =
    '<div class="artifact-streaming" id="streamingWrap">' +
    '<div class="artifact-write-status" id="writeStatus">' +
    '<div class="write-status-dot"></div><span id="writeStatusText">Preparing\u2026</span>' +
    '</div>' +
    skeletonHTML() +
    '<pre class="artifact-stream-content" id="streamContent" style="display:none;"></pre>' +
    '</div>';

  artifactStreamingEl = contentEl.querySelector("#streamContent");
  document.getElementById("artifactPanel").classList.add("open");
  document.getElementById("panelDivider").classList.add("visible");
  document.getElementById("versionNav").style.display = "none";
}

function appendArtifactStream(content, meta) {
  if (meta) {
    artifactStreamMeta = { ...artifactStreamMeta, ...meta };
    if (meta.title) {
      document.getElementById("artifactTitle").textContent = meta.title;
    }
    if (meta.filename) {
      document.getElementById("artifactMeta").textContent = meta.filename;
    }
  }

  if (!artifactStreamingEl || !content) return;

  if (!artifactStreamBuffer) {
    // First real content chunk — swap skeleton for the code view
    const skeleton = document.querySelector(".artifact-skeleton");
    if (skeleton) skeleton.remove();
    const statusText = document.getElementById("writeStatusText");
    if (statusText) statusText.textContent = "Writing\u2026";
    artifactStreamingEl.style.display = "block";
  }

  artifactStreamBuffer += content;

  // Render text + blinking cursor
  const lines = artifactStreamBuffer.split("\n").length;
  artifactStreamingEl.innerHTML =
    esc(artifactStreamBuffer) +
    '<span class="stream-cursor"></span>';

  // Update line counter in status bar
  const statusText = document.getElementById("writeStatusText");
  if (statusText) statusText.textContent = `Writing\u2026 ${lines} line${lines === 1 ? "" : "s"}`;

  const contentArea = document.getElementById("artifactContent");
  contentArea.scrollTop = contentArea.scrollHeight;
}

function finalizeArtifactStream() {
  // Remove the status bar and cursor — showArtifactContent will re-render cleanly
  const wrap = document.getElementById("streamingWrap");
  if (wrap) wrap.remove();
  artifactStreamingEl = null;
  artifactStreamBuffer = "";
  artifactStreamMeta = null;
}

// ---- WebSocket ----

function connectWs() {
  if (ws) ws.close();
  if (!currentSessionId) return;

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/${currentSessionId}`);

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === "text") {
      finishThinking();
      if (!currentAssistantEl) startAssistantMsg();
      assistantBuffer += msg.content;
      currentAssistantEl.innerHTML = renderMarkdown(assistantBuffer);
      scrollBottom();
    }
    else if (msg.type === "thinking") {
      if (!currentThinkingEl) startThinkingBlock();
      thinkingBuffer += msg.content;
      updateThinkingBlock();
      scrollBottom();
    }
    else if (msg.type === "tool_generating") {
      finishThinking();
      if (msg.name === "create_artifact" || msg.name === "update_artifact") {
        startArtifactStream(null);
      }
    }
    else if (msg.type === "tool_progress") {
      if (msg.name === "create_artifact" || msg.name === "update_artifact") {
        appendArtifactStream(msg.content || "", msg.metadata || null);
      }
    }
    else if (msg.type === "tool_start") {
      finishThinking();
      if (msg.name !== "create_artifact" && msg.name !== "update_artifact") {
        addToolBlock(msg.name, msg.arguments);
      }
    }
    else if (msg.type === "tool_result") {
      if (msg.name !== "create_artifact" && msg.name !== "update_artifact") {
        updateToolBlock(msg.name, msg.result);
      }
    }
    else if (msg.type === "artifact") {
      finalizeArtifactStream();
      const a = msg.artifact;
      const existIdx = sessionArtifacts.findIndex(s => s.id === a.id);
      if (existIdx >= 0) {
        sessionArtifacts[existIdx].title = a.title;
        sessionArtifacts[existIdx].current_version = a.version;
      } else {
        sessionArtifacts.push({
          id: a.id,
          title: a.title,
          content_type: a.content_type,
          language: a.language || "",
          filename: a.filename,
          current_version: a.version || 1,
        });
      }
      addArtifactRef(a);
      showArtifact(a);
    }
    else if (msg.type === "done") {
      finishThinking();
      currentAssistantEl = null;
      assistantBuffer = "";
      sending = false;
      document.getElementById("btnSend").disabled = false;
      loadSessions();
    }
    else if (msg.type === "error") {
      addErrorMsg(msg.content);
      sending = false;
      document.getElementById("btnSend").disabled = false;
    }
  };

  ws.onerror = () => {
    sending = false;
    document.getElementById("btnSend").disabled = false;
  };
}

// ---- Message rendering ----

function addUserMsg(text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg msg-user";
  div.textContent = text;
  container.appendChild(div);
}

function startAssistantMsg() {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg msg-assistant";
  container.appendChild(div);
  currentAssistantEl = div;
}

function addAssistantMsg(text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg msg-assistant";
  div.innerHTML = renderMarkdown(text);
  container.appendChild(div);
}

function startThinkingBlock() {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "thinking-block";
  div.innerHTML = `
    <div class="thinking-header" onclick="this.parentElement.classList.toggle('expanded')">
      <div class="thinking-spinner"></div>
      <span class="thinking-check">&#10003;</span>
      <span class="thinking-summary">Thinking...</span>
      <span class="thinking-toggle"></span>
    </div>
    <div class="thinking-body"></div>
    <div class="thinking-done-badge">&#10003; Done</div>`;
  container.appendChild(div);
  currentThinkingEl = div;
  thinkingBuffer = "";
}

function updateThinkingBlock() {
  if (!currentThinkingEl) return;
  const body = currentThinkingEl.querySelector(".thinking-body");
  body.textContent = thinkingBuffer;
  const summary = currentThinkingEl.querySelector(".thinking-summary");
  const firstLine = thinkingBuffer.split("\n").find(l => l.trim().length > 10) || "Thinking...";
  summary.textContent = firstLine.trim().substring(0, 100);
}

function finishThinking() {
  if (!currentThinkingEl) return;
  currentThinkingEl.classList.add("done");
  const summary = currentThinkingEl.querySelector(".thinking-summary");
  const text = thinkingBuffer.trim();
  if (text) {
    const sentences = text.replace(/\n/g, " ").split(/[.!?]+/).filter(s => s.trim().length > 5);
    const autoSummary = sentences.length > 0
      ? sentences[0].trim().substring(0, 80)
      : text.substring(0, 80);
    summary.textContent = autoSummary;
  }
  currentThinkingEl = null;
  thinkingBuffer = "";
}

function addToolBlock(name, args) {
  const container = document.getElementById("messages");
  const details = document.createElement("details");
  details.className = "tool-block";
  details.id = "tool-" + name + "-" + Date.now();
  details.innerHTML = `<summary>Tool: ${esc(name)}</summary>
    <pre>Arguments: ${esc(JSON.stringify(args, null, 2))}</pre>
    <pre class="tool-result">Running...</pre>`;
  container.appendChild(details);
  scrollBottom();
}

function updateToolBlock(name, result) {
  const blocks = document.querySelectorAll(".tool-block");
  for (let i = blocks.length - 1; i >= 0; i--) {
    const summary = blocks[i].querySelector("summary");
    if (summary && summary.textContent.includes(name)) {
      const pre = blocks[i].querySelector(".tool-result");
      if (pre) pre.textContent = result;
      break;
    }
  }
  scrollBottom();
}

function addErrorMsg(text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg msg-assistant";
  div.style.color = "var(--error)";
  div.textContent = "Error: " + text;
  container.appendChild(div);
  scrollBottom();
}

// ---- Input ----

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
}

function send() {
  if (sending) return;
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  if (!currentSessionId) {
    newSession().then(() => setTimeout(() => doSend(text), 300));
  } else {
    doSend(text);
  }
  input.value = "";
  autoResize(input);
}

function doSend(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    connectWs();
    setTimeout(() => doSend(text), 500);
    return;
  }
  sending = true;
  document.getElementById("btnSend").disabled = true;
  addUserMsg(text);
  scrollBottom();
  ws.send(JSON.stringify({ content: text }));
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 200) + "px";
}

function scrollBottom() {
  const m = document.getElementById("messages");
  m.scrollTop = m.scrollHeight;
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

marked.use({
  gfm: true,
  breaks: true,
});

function renderMarkdown(text) {
  return marked.parse(text || "");
}

// ---- Panel divider drag ----

(function() {
  const divider = document.getElementById("panelDivider");
  const wrapper = document.querySelector(".main-wrapper");
  let dragging = false;

  divider.addEventListener("mousedown", (e) => {
    e.preventDefault();
    dragging = true;
    divider.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const rect = wrapper.getBoundingClientRect();
    const offset = e.clientX - rect.left;
    const total = rect.width;
    const chatPct = Math.max(20, Math.min(80, (offset / total) * 100));
    const artPct = 100 - chatPct;

    const chatPanel = document.getElementById("chatPanel");
    const artPanel = document.getElementById("artifactPanel");
    chatPanel.style.flex = `1 1 ${chatPct}%`;
    artPanel.style.flex = `1 1 ${artPct}%`;
  });

  document.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  });
})();

// ---- Sidebar collapse ----

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const btn = document.getElementById("btnCollapse");
  sidebar.classList.toggle("collapsed");
  btn.classList.toggle("shifted");
}

// ---- Init ----

async function init() {
  await loadSessions();

  fetch(`${API}/api/facts/stats`).then(r => r.json()).then(d => updateMemoryBadge(d.count)).catch(() => {});

  const saved = localStorage.getItem("lastSessionId");
  if (saved) {
    const res = await fetch(`${API}/api/sessions`);
    const sessions = await res.json();
    const match = sessions.find(s => s.id === saved);
    if (match) {
      openSession(match.id, match.title);
      return;
    }
  }

  const res = await fetch(`${API}/api/sessions`);
  const sessions = await res.json();
  if (sessions.length > 0) {
    openSession(sessions[0].id, sessions[0].title);
  }
}

init();
</script>
